[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleancarry"
version = "0.1.0"
description = "Audit-first Hyperliquid spot/perp carry research, shadow, and guarded execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "rich>=13,<15",
  "typer>=0.12,<1",
  "hyperliquid-python-sdk>=0.24,<0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
cleancarry = "cleancarry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cleancarry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
